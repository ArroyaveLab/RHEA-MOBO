[project]
name = "rhea-mobo"
version = "0.1.0"
description = "Cost-aware multi-objective Bayesian optimization for composition design of refractory high-entropy alloys (RHEAs)."
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.12.*"
authors = [
    { name = "Md Shafiqul Islam", email = "shafiq@tamu.edu" },
    { name = "Doguhan Sariturk", email = "doguhan.sariturk@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2",
    "botorch>=0.11",
    "gpytorch>=1.11",
    "numpy>=1.26",
    "pandas>=2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pymatgen>=2024.1",
    "materialsframework[matgl,sqsgen]>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.13"]
build-backend = "uv_build"

[project.urls]
Home-page = "https://github.com/ArroyaveLab/RHEA-MOBO/"
Issues = "https://github.com/ArroyaveLab/RHEA-MOBO/issues"
Repository = "https://github.com/ArroyaveLab/RHEA-MOBO.git"

[project.scripts]
rhea-mobo = "rhea_mobo.main:main"

[dependency-groups]
dev = [
    "prek>=0.3.10",
    "pytest>=8.3",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E", # pycodestyle Errors
    "ERA", # Eradicate
    "F", # Pyflakes
    "FA",  # flake8-future-annotations
    "I", # isort
    "ICN", # flake8-import-conventions
    "N", # pep8-naming
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "Q", # flake8-quotes
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W", # pycodestyle Warnings
]
ignore = [
    "E501", # line too long
    "N803", # argument name should be lowercase
    "N806", # variable name should be lowercase
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"src/rhea_mobo/objective.py" = ["F403", "F405"]
"scripts/bo_script_full.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
